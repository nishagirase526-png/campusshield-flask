<!DOCTYPE html>
<html>

<head>
    <title>Password Strength - CampusShield</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">🛡️ CampusShield</div>

        <div class="nav-links">
            <a href="Cyber-safety.html">Cyber Safety</a>
            <form method="post" action="/logout" class="logout-form"><button type="submit" class="logout-button">Logout</button></form>
        </div>
    </nav>


    <main class="password-page">

        <div class="page-heading">

            <p class="tagline">CYBER SAFETY TOOL</p>

            <h1>Password Strength Checker</h1>

            <p>
                Check the strength of your password.
            </p>

        </div>


        <div class="password-box">

            <label>Enter Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button onclick="checkPassword()">
                Check Strength
            </button>

            <div id="result"></div>

        </div>

    </main>


    <script>

        function checkPassword() {

            const password =
                document.getElementById("password").value;

            const result =
                document.getElementById("result");


            if (password.length === 0) {

                result.innerHTML =
                    "Please enter a password.";

                return;
            }


            let score = 0;


            if (password.length >= 8) {
                score++;
            }

            if (/[A-Z]/.test(password)) {
                score++;
            }

            if (/[0-9]/.test(password)) {
                score++;
            }

            if (/[^A-Za-z0-9]/.test(password)) {
                score++;
            }


            if (score <= 1) {

                result.innerHTML =
                    "⚠️ Weak Password";

            }

            else if (score <= 3) {

                result.innerHTML =
                    "🟡 Medium Password";

            }

            else {

                result.innerHTML =
                    "🟢 Strong Password";

            }

        }

    </script>

</body>

</html>
