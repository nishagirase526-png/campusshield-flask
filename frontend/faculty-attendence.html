<!DOCTYPE html>
<html>

<head>
    <script src='api-config.js'></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Attendance - CampusShield</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">🛡️ CampusShield</div>

        <div class="nav-links">
            <a href="faculty-dashboard.html">Dashboard</a>
            <form method="post" action="/logout" class="logout-form"><button type="submit" class="logout-button">Logout</button></form>
        </div>
    </nav>

    <main class="faculty-attendance-page">

        <div class="page-heading">
            <p class="tagline">FACULTY PORTAL</p>

            <h1>Manage Attendance</h1>

            <p>
                Record and manage student attendance.
            </p>
        </div>


        <div class="attendance-card">

            <div class="attendance-controls">

                <div>
                    <label for="attendanceDate">Date</label>
                    <input type="date" id="attendanceDate">
                </div>

                <div>
                    <label for="classSubjectId">Assigned class and subject</label>
                    <select id="classSubjectId" required>
                        <option value="">Loading your assignments...</option>
                    </select>
                </div>

            </div>


            <h2>Student Attendance Entry</h2>

            <form id="attendanceForm">

                <label for="studentId">Student</label>
                <select id="studentId" name="studentId" required disabled>
                    <option value="">Select an assigned class and subject first</option>
                </select>

                <label for="status">Status</label>
                <select id="status" name="status" required>
                    <option value="">Select Status</option>
                    <option value="present">Present</option>
                    <option value="absent">Absent</option>
                    <option value="late">Late</option>
                    <option value="excused">Excused</option>
                </select>

                <button type="submit" id="saveAttendanceButton">
                    Save Attendance
                </button>

            </form>


            <div id="attendanceMessage"></div>


            <h2 class="table-title">Attendance records for this class and subject</h2>

            <p id="attendanceEmpty" class="empty-state" aria-live="polite">
                Select an assigned class and subject to view attendance.
            </p>

            <table id="attendanceRecordsTable" hidden>

                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="attendanceTable">
                </tbody>

            </table>

        </div>

    </main>


    <script>

        const attendanceForm = document.getElementById("attendanceForm");
        const saveButton = document.getElementById("saveAttendanceButton");
        const attendanceMessage = document.getElementById("attendanceMessage");
        const attendanceTable = document.getElementById("attendanceTable");
        const attendanceEmpty = document.getElementById("attendanceEmpty");
        const attendanceRecordsTable = document.getElementById("attendanceRecordsTable");
        const classSubjectSelect = document.getElementById("classSubjectId");
        const studentSelect = document.getElementById("studentId");
        const classSubjects = new Map();

        async function readApiResponse(response) {
            const contentType = response.headers.get("content-type") || "";
            if (!contentType.includes("application/json")) {
                throw new Error(
                    "The Faculty API returned a non-JSON response (HTTP " +
                    response.status +
                    "). Confirm the current CampusShield Flask server is running."
                );
            }
            return response.json();
        }

        async function loadClassSubjects() {
            try {
                const response = await fetch("/api/faculty/class-subjects", {
                    credentials: "include"
                });
                const data = await readApiResponse(response);
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Unable to load assigned classes.");
                }

                classSubjectSelect.replaceChildren();
                const placeholder = document.createElement("option");
                placeholder.value = "";
                placeholder.textContent = data.class_subjects.length
                    ? "Select an assigned class and subject"
                    : "No assigned classes or subjects";
                classSubjectSelect.appendChild(placeholder);

                (data.class_subjects || []).forEach(function (item) {
                    const option = document.createElement("option");
                    option.value = item.class_subject_id;
                    option.textContent = item.course_name + " — Year " +
                        item.year_level + " " + item.division + ", " +
                        item.subject_name + " (" + item.subject_code +
                        "), Semester " + item.semester + " · " +
                        item.academic_year;
                    classSubjects.set(String(item.class_subject_id), item);
                    classSubjectSelect.appendChild(option);
                });
                if (!data.class_subjects.length) {
                    showMessage("No class subjects are assigned to your faculty account.", true);
                }
            } catch (error) {
                classSubjectSelect.replaceChildren();
                const option = document.createElement("option");
                option.value = "";
                option.textContent = "Unable to load assigned classes";
                classSubjectSelect.appendChild(option);
                showMessage(error.message || "Unable to load assigned classes.", true);
            }
        }

        async function loadClassStudents() {
            const classSubjectId = classSubjectSelect.value;
            studentSelect.disabled = true;
            studentSelect.replaceChildren();
            const placeholder = document.createElement("option");
            placeholder.value = "";
            placeholder.textContent = classSubjectId ? "Loading students..." : "Select an assigned class and subject first";
            studentSelect.appendChild(placeholder);
            if (!classSubjectId) return;

            try {
                const response = await fetch(
                    "/api/faculty/class-subjects/" +
                        encodeURIComponent(classSubjectId) + "/students",
                    { credentials: "include" }
                );
                const data = await readApiResponse(response);
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Unable to load students.");
                }
                studentSelect.replaceChildren();
                const studentPlaceholder = document.createElement("option");
                studentPlaceholder.value = "";
                studentPlaceholder.textContent = data.students.length
                    ? "Select a student"
                    : "No active students in this class";
                studentSelect.appendChild(studentPlaceholder);
                (data.students || []).forEach(function (student) {
                    const option = document.createElement("option");
                    option.value = student.student_id;
                    option.textContent = student.full_name + " · Roll " + student.roll_number;
                    studentSelect.appendChild(option);
                });
                studentSelect.disabled = !data.students.length;
            } catch (error) {
                studentSelect.replaceChildren();
                const errorOption = document.createElement("option");
                errorOption.value = "";
                errorOption.textContent = error.message || "Unable to load students.";
                studentSelect.appendChild(errorOption);
                showMessage(error.message || "Unable to load students.", true);
            }
        }

        async function loadAttendanceRecords() {
            attendanceTable.replaceChildren();
            attendanceRecordsTable.hidden = true;
            if (!classSubjectSelect.value) {
                attendanceEmpty.classList.remove("error");
                attendanceEmpty.classList.add("empty-state");
                attendanceEmpty.textContent =
                    "Select an assigned class and subject to view attendance.";
                return;
            }

            attendanceEmpty.className = "empty-state";
            attendanceEmpty.textContent = "Loading attendance records...";
            try {
                const query = new URLSearchParams({
                    class_subject_id: classSubjectSelect.value
                });
                const response = await fetch(
                    "/api/faculty/attendance?" + query.toString(),
                    { credentials: "include" }
                );
                const data = await readApiResponse(response);
                if (!response.ok || !data.success) {
                    throw new Error(data.message || "Unable to load attendance records.");
                }
                const records = data.records || [];
                if (!records.length) {
                    attendanceEmpty.textContent =
                        "No attendance records exist for this class and subject yet.";
                    return;
                }

                attendanceEmpty.textContent = "";
                attendanceEmpty.className = "";
                attendanceRecordsTable.hidden = false;
                records.forEach(function (record) {
                    const row = attendanceTable.insertRow();
                    row.insertCell(0).textContent =
                        record.student_name + " · Roll " + record.roll_number;
                    row.insertCell(1).textContent = record.attendance_date;
                    row.insertCell(2).textContent = record.status;
                });
            } catch (error) {
                attendanceEmpty.className = "empty-state error";
                attendanceEmpty.textContent =
                    error.message || "Unable to load attendance records.";
            }
        }

        classSubjectSelect.addEventListener("change", function () {
            loadClassStudents();
            loadAttendanceRecords();
        });

        function showMessage(text, isError) {
            attendanceMessage.textContent = text;
            attendanceMessage.style.color = isError ? "#b42318" : "#027a48";
        }

        attendanceForm.addEventListener("submit", async function (event) {

            event.preventDefault();
            showMessage("");

            const studentId = studentSelect.value;
            const classSubjectId = document.getElementById("classSubjectId").value.trim();
            const attendanceDate = document.getElementById("attendanceDate").value.trim();
            const status = document.getElementById("status").value.trim();

            if (!studentId || !classSubjectId || !attendanceDate || !status) {
                showMessage("Please fill all fields.", true);
                return;
            }

            const payload = {
                student_id: Number(studentId),
                class_subject_id: Number(classSubjectId),
                attendance_date: attendanceDate,
                status: status
            };

            saveButton.disabled = true;
            saveButton.textContent = "Saving...";

            try {

                const response = await fetch("/api/faculty/attendance", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify(payload)
                });

                const data = await readApiResponse(response);

                if (response.status === 401) {
                    window.location.href = "/login.html";
                    return;
                }

                if (response.status === 403) {
                    showMessage(data.message || "Faculty access is required.", true);
                    return;
                }

                if (!response.ok || !data.success) {
                    showMessage(
                        data.message || "Unable to save attendance.",
                        true
                    );
                    return;
                }

                showMessage(
                    data.message || "Attendance saved successfully.",
                    false
                );
                await loadAttendanceRecords();
                attendanceForm.reset();

            } catch (error) {
                showMessage(error.message || "Unable to connect to the server.", true);
            } finally {
                saveButton.disabled = false;
                saveButton.textContent = "Save Attendance";
            }

        });

        document.getElementById("attendanceDate").value =
            new Date().toISOString().slice(0, 10);
        loadClassSubjects();

    </script>

</body>

</html>
